description: >-
  Henrik har arbetat med mjukvaruutveckling sedan 1999, då han klev in i den
  stockholmska IT-boomen. Sedan 2017 driver han sitt eget bolag, Henrik
  Becker Consulting AB, och har vuxit till en senior backend-fokuserad
  konsult med djup expertis inom systemintegration och automatisering. Vid
  sidan av uppdragen driver han återkommande egna tekniska projekt från idé
  till driftsatt produkt. Han har arbetat med varje större inkarnation av
  .NET från Framework 1.0 till dagens .NET 10, och fokuserar på
  backend-utveckling med automation, integration och ren kod byggd på
  SOLID-principer och Domain Driven Design.
