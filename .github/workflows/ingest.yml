name: Ingest CV
# Sends the AI document (/assets/henrik-becker.ai) to the CV chat bot after each deploy.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The Pages hostname: the custom domain's bot protection blocks GitHub's runners.
      - name: Download
        run: curl -fsSL https://henrikbecker.pages.dev/assets/henrik-becker.ai -o henrik-becker.md

      - name: Ingest
        env:
          API_KEY: ${{ secrets.AZURE_OPENAI_APIKEY }}
        run: |
          curl -fsS -X POST https://henrikbecker.azurewebsites.net/ai/ingest/henrik \
            -H "Content-Type: text/markdown; charset=utf-8" \
            -H "Authorization: Bearer $API_KEY" \
            -H "X-Commit: ${{ github.event.workflow_run.head_sha || github.sha }}" \
            -H "X-Source: github" \
            --data-binary @henrik-becker.md
