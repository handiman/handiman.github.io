name: Publish gist
# Publishes the JSON resume (/assets/henrik-becker.resume.json) to the gist after each deploy, when it changed.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed
    branches:
      - master

concurrency:
  group: publish-gist
  cancel-in-progress: false

jobs:
  gist:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GIST_ID: 3881a8e890dd1032cce3f5e655859717
    steps:
      # The build run's own artifact, so it can't be stale like the live site might be right after a deploy.
      # A manual dispatch uses the latest successful build on master.
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name cv-exports --dir _exports
          cp _exports/henrik-becker.resume.json resume.json

      # Fine-grained tokens can't push to a gist over git (403), but the REST API accepts them.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GIST_TOKEN is not set, skipping gist publish"
            exit 0
          fi
          # The gist is public, so the current file can be read without a token.
          git clone --depth 1 "https://gist.github.com/${GIST_ID}.git" _gist
          if cmp -s resume.json _gist/resume.json; then
            echo "resume.json unchanged, nothing to publish"
            exit 0
          fi
          jq -Rs '{files: {"resume.json": {content: .}}}' resume.json \
            | gh api --method PATCH "gists/${GIST_ID}" --input - --silent
