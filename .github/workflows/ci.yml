name: Build and Publish
on:
  workflow_dispatch:
  push:
    branches: [ master ]
concurrency:
  group: build-and-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Empty until the secret exists; the notify step is skipped then.
      DISPATCH_TOKEN: ${{ secrets.SHARED_CONTENT_DISPATCH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Typst
        run: |
          sudo apt-get update 
          sudo apt-get install -y curl xz-utils
          curl -L https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz -o _typst.tar.xz
          tar -xf _typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst

      - name: Build gh-pages
        run: |
           npm install
           npm run build

      - name: Compile CV PDFs
        run: npm run typst

      # The publish-gist and publish-cv-json workflows read these from the run, not from the live site.
      - name: Upload CV exports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-exports
          path: |
            _site/assets/henrik-becker.resume.json
            _site/assets/henrik-becker.jsonld
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Cloudflare Pages
        # cloudflare/pages-action was retired; wrangler-action is its replacement.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=henrikbecker
      
      # becker-consulting.se reads /assets/site-data.json at build time; ask it to rebuild.
      # Needs a fine-grained token with Contents: read & write on that repo.
      - name: Notify becker-consulting.se
        if: ${{ env.DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SHARED_CONTENT_DISPATCH_TOKEN }}
          repository: becker-consulting/becker-consulting.github.io
          event-type: shared-content-updated
