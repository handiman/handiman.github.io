name: Build and Publish
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty until the secret exists; the notify step is skipped then.
      DISPATCH_TOKEN: ${{ secrets.SHARED_CONTENT_DISPATCH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Typst
        run: |
          sudo apt-get update 
          sudo apt-get install -y curl xz-utils
          curl -L https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz -o _typst.tar.xz
          tar -xf _typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst

      - name: Build gh-pages
        run: |
           npm install
           npm run build

      - name: Compile CV PDFs
        run: npm run typst

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: henrikbecker
          directory: _site
      
      # becker-consulting.se reads /assets/site-data.json at build time; ask it to rebuild.
      # Needs a fine-grained token with Contents: read & write on that repo.
      - name: Notify becker-consulting.se
        if: ${{ env.DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SHARED_CONTENT_DISPATCH_TOKEN }}
          repository: becker-consulting/becker-consulting.github.io
          event-type: shared-content-updated

      - name: Publish gh-pages
        if: false
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: gh-pages
          FOLDER: _site
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish gist
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.AUTH_TOKEN }}
          gist_id: 3881a8e890dd1032cce3f5e655859717
          gist_file_name: resume.json
          file_path: ./_site/assets/henrik-becker.resume.json
